<!doctype html>
<!-- The 1200×630 link preview (apps/api/public/og.png). Render with render.sh. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bodoni+Moda:ital,opsz,wght@1,6..96,700..900&family=JetBrains+Mono:wght@400;600&display=block"
    />
    <style>
      :root {
        --paper: #0e1c1c;
        --surface: #152828;
        --ink: #e7f0ed;
        --graphite: #93aea9;
        --staff: #29413f;
        --red-pencil: #ff6461;
        --brass: #edb94e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Archivo", sans-serif;
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 56px;
        align-items: center;
        padding: 0 72px;
        position: relative;
      }
      .wordmark {
        position: absolute;
        top: 56px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 800;
        font-size: 28px;
        font-variation-settings: "wdth" 125;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: var(--brass);
        color: var(--paper);
        display: grid;
        place-items: center;
      }
      .logo svg {
        width: 32px;
        height: 32px;
      }
      h1 {
        margin: 40px 0 28px;
        font-weight: 900;
        line-height: 0.88;
        font-variation-settings: "wdth" 62;
        font-size: 132px;
        letter-spacing: -0.01em;
        position: relative;
        isolation: isolate;
      }
      h1 span {
        display: block;
        position: relative;
      }
      h1 span::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: -72px;
        right: -800px;
        top: 0.02em;
        height: calc(0.88em + 1px);
        background: repeating-linear-gradient(
          to bottom,
          var(--staff) 0 1px,
          transparent 1px 0.22em
        );
      }
      p.lede {
        margin: 0;
        font-size: 30px;
        line-height: 1.3;
        color: var(--graphite);
        max-width: 560px;
      }
      p.lede strong {
        color: var(--ink);
        font-weight: 700;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--staff);
        border-radius: 16px;
        overflow: hidden;
        margin-top: 64px;
        position: relative;
        z-index: 1;
        box-shadow: 0 30px 60px rgb(0 0 0 / 0.35);
      }
      .code {
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        padding: 18px 0;
      }
      .code div {
        padding: 3px 22px;
        white-space: pre;
        color: var(--graphite);
      }
      .code .hit {
        background: rgb(255 100 97 / 0.12);
        color: var(--ink);
        box-shadow: inset 3px 0 var(--red-pencil);
      }
      .note {
        border-top: 1px solid var(--staff);
        padding: 22px;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--red-pencil);
        font-weight: 700;
        font-size: 20px;
      }
      .dyn {
        font-family: "Bodoni Moda", serif;
        font-style: italic;
        font-weight: 900;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .note p {
        margin: 12px 0 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.25;
      }
      .url {
        position: absolute;
        bottom: 52px;
        left: 72px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        color: var(--brass);
      }
    </style>
  </head>
  <body>
    <div class="wordmark">
      <span class="logo"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8.5 3h7l4 18h-15z" />
          <path d="M12 16l5-10" />
          <path d="M6.5 16h11" /></svg
      ></span>
      Not Quite My Tempo
    </div>
    <div>
      <h1><span>Not quite</span><span>my tempo.</span></h1>
      <p class="lede">
        <strong>Fletcher</strong> reviews every pull request, line by line, in
        about a minute.
      </p>
    </div>
    <div class="card">
      <div class="code">
        <div>13 const beats = bar.signature.beats;</div>
        <div class="hit">14 return bar.duration / beats;</div>
        <div>15 };</div>
      </div>
      <div class="note">
        <div class="tag"><span class="dyn">ff</span> Critical</div>
        <p>Were you rushing or were you dragging?</p>
      </div>
    </div>
    <div class="url">notmytempo.dev</div>
  </body>
</html>
